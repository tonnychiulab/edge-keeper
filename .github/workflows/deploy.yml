name: Verify and Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, Unit Tests, Build & Headless E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright-core install chromium --with-deps

      - name: Run Headless Browser E2E Check
        run: npm run test:e2e

  deploy:
    name: Deploy to Cloudflare Workers
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Deploy Static Assets to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config wrangler.jsonc

  deploy_pending_notice:
    name: Cloudflare Secrets Not Configured Yet
    needs: verify
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - name: Print Setup Reminder
        run: |
          echo "Cloudflare deployment skipped because vars.CLOUDFLARE_ACCOUNT_ID is not set."
          echo "Run 'npm run wizard' locally to bind CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN."
